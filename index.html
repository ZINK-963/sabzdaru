    <div class="topbar">
      <div class="wrap">
        <span
          ><svg><use href="#i-truck" /></svg> ارسال رایگان سفارش‌های بالای
          ۸۰۰٬۰۰۰ تومان</span

          ><svg><use href="#i-chat" /></svg> پشتیبانی هر روز، ۹ تا ۲۱</span
        >
      </div>
    </div>

    <header class="site">
      <div class="wrap">
        <div class="bar">
          <a class="logo" data-go="home"
            ><span class="mark"
              ><svg><use href="#i-leaf" /></svg></span
            >سبزدارو</a
          >
          <div class="searchbox">
            <svg><use href="#i-search" /></svg>
            <input
              class="input"
              id="q"
              type="search"
              placeholder="نام محصول، برند یا دسته‌بندی"
              aria-label="جست‌وجو"
              autocomplete="off"
            />
            <div id="sugg"></div>
          </div>
          <div class="bar-actions">
            <button
              class="iconbtn theme-toggle"
              id="btn-theme"
              aria-label="تغییر تم"
            >
              <svg class="moon"><use href="#i-moon" /></svg
              ><svg class="sun"><use href="#i-sun" /></svg>
            </button>
            <button class="iconbtn" id="btn-fav" aria-label="علاقه‌مندی‌ها">
              <svg><use href="#i-heart" /></svg
              ><span class="dot hidden" id="favdot">۰</span>
            </button>
            <button class="iconbtn" id="btn-cmp" aria-label="مقایسه">
              <svg><use href="#i-scale" /></svg
              ><span class="dot hidden" id="cmpdot">۰</span>
            </button>
            <button class="iconbtn" id="btn-acc" aria-label="حساب کاربری">
              <svg><use href="#i-user" /></svg>
            </button>
            <button class="iconbtn" id="btn-cart" aria-label="سبد خرید">
              <svg><use href="#i-cart" /></svg
              ><span class="dot hidden" id="cartdot">۰</span>
            </button>
          </div>
        </div>
      </div>
      <nav class="cats"><div class="wrap" id="catnav"></div></nav>
    </header>

    <main id="app">
      <div class="boot" aria-label="در حال بارگذاری">
        <div class="boot-spin"></div>
      </div>
