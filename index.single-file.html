header.site.scrolled{background:rgba(26,42,24,.95)}
.topbar{background:rgba(26,42,24,.95)}
footer.site{background:rgba(30,48,28,.95)}
:root[data-theme="dark"] header.site.scrolled{background:rgba(8,12,7,.93)}
:root[data-theme="dark"] .topbar{background:rgba(4,6,3,.85)}
:root[data-theme="dark"] footer.site{background:rgba(6,9,5,.85)}
.price{white-space:nowrap}

/* BACK-TO-TOP: its arrow was already an up-arrow; I'd also rotated it -90°
   so it pointed LEFT. And it sat on top of the product page's sticky buy bar. */
.to-top svg{transform:none}
@media(max-width:720px){
  body:has(.sticky-buy) .to-top{bottom:calc(env(safe-area-inset-bottom,0px) + 156px)}
}

/* DESKTOP MEGA MENU — nav.cats .wrap is a horizontal scroller on phones, and
   overflow-x:auto forces overflow-y:auto too, which clipped the absolutely
   positioned dropdown into invisibility. On ≥721px all four links fit, so the
   scroller isn't needed and must not clip. */
@media(min-width:721px){nav.cats .wrap{overflow:visible}}

/* MEGA PANEL on phones: fully opaque and pinned symmetrically inside the header */
.mega-panel{background:#F7F9F3}
:root[data-theme="dark"] .mega-panel{background:#131B12}
@media(max-width:720px){
  .mega-panel{left:10px;right:10px;width:auto;min-width:0}
}

/* HERO — desktop: the previous-arrow overlapped the first letters of the
   subtitle, so give the text column room beside the arrows */
@media(min-width:721px){.hero-panel .wrap2{padding-inline:84px}}

/* FEATURE BAR (اصالت کالا / ضمانت بازگشت / …) — a compact 2×2 grid on phones
   instead of four tall stacked rows with a big empty gap beside each */
@media(max-width:480px){
  .hero-trust{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3) var(--s2);padding:var(--s4)}
  .hero-trust div{min-width:0;font-size:12.5px;gap:6px}
  .hero-trust div i{width:28px;height:28px}
}

/* First section on a phone doesn't need a 48px gap under the header */
@media(max-width:720px){#app>.wrap.section:first-child{padding-top:var(--s5)}}

/* hero arrows were hidden <560px to avoid covering the headline; they now live
   in the bottom corners (see the ≤720px block above), so show them again */
@media(max-width:560px){.hero-arrow{display:grid}}

/* rows laid out with .between (price | badge, title | button …) must wrap
   instead of overflowing when the screen can't fit both sides */
.between{flex-wrap:wrap}
@media(max-width:480px){.pdp .card .price{font-size:22px!important}}

/* PHONE DENSITY — "everything is too big": category tiles were one per row at
   ~100px tall each, and product images were full squares. */
@media(max-width:480px){
  .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
  .cat{flex-direction:column;align-items:flex-start;gap:var(--s2);padding:var(--s4)}
  .cat i{width:40px;height:40px}
  .cat i svg{width:20px;height:20px}
  .cat b{font-size:14px}
  .prod-media{aspect-ratio:4/3}
  .prod-media>svg{width:40px;height:40px}
  .section-head h2{font-size:20px}
}
@media(max-width:340px){.cat-grid{grid-template-columns:minmax(0,1fr)}}

/* DESKTOP HERO: the category-pill column and the "next" arrow both sat at the
   far end of the banner, vertically centred — the pills covered the arrow and
   swallowed its clicks. Move the pills inward, clear of the arrow. */
@media(min-width:721px){.hero-pills{inset-inline-end:calc(var(--s5) + 44px + var(--s4))}}

/* first paint while we check whether a backend is reachable */
.boot{display:grid;place-items:center;min-height:55vh}
.boot-spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:rot .8s linear infinite}

<script>
/* ============================================================
   API CLIENT — talks to the real backend (Next.js in /backend, or the
   zero-dependency dev-server in /backend/dev-server — same contract,
   see docs/API-CONTRACT.md).

   Every call FAILS SOFT: it returns {ok:false,status,error} instead of
   throwing, so callers never need try/catch.

   LIVE vs DEMO MODE
   At boot, bootApp() (live.js) asks GET /api/health. If a SABZDARU
   backend answers → API.live = true and the whole app runs against it
   (catalog, accounts, orders, payments, admin). If nothing answers
   (opened from file://, a static host, an artifact preview…) → API.live
   stays false and the app runs entirely on local demo data, exactly as
   before. That makes the same files usable for both a client demo and
   a real deployment.

   WHERE IS THE BACKEND?
   Same-origin by default ("/api/…") — the supported deployment is the
   backend serving this frontend, so session cookies just work. To point
   at another origin for development: open  index.html?api=http://host:4000
   (remembered in localStorage; ?api= with an empty value clears it) or set
   <meta name="sd-api-base" content="…">. Cross-origin additionally needs
   CORS + SameSite=None cookies on the server — not configured by default.
   ============================================================ */
var API_BASE = (function () {
  try {
    var q = new URLSearchParams(location.search).get("api");
    if (q !== null) localStorage.setItem("sd-api-base", q);
    var v = localStorage.getItem("sd-api-base");
    if (v) return v.replace(/\/$/, "");
    var m = document.querySelector('meta[name="sd-api-base"]');
    if (m && m.content) return m.content.replace(/\/$/, "");
  } catch (e) { /* storage blocked → same-origin */ }
  return "";
})();

async function apiFetch(path, opts) {
  opts = opts || {};
  var timeoutMs = opts.timeoutMs || 15000;
  var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, timeoutMs) : null;
  var init = { method: opts.method || "GET", credentials: "include", headers: {} };
  if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = opts.body; }
  if (ctl) init.signal = ctl.signal;
  try {
    var res = await fetch(API_BASE + path, init);
    var data = null;
    try { data = await res.json(); } catch (e) { /* empty or non-JSON body */ }
    if (!res.ok) {
      return { ok: false, status: res.status, data: data, error: (data && data.error) || ("خطای سرور: " + res.status) };
    }
    return { ok: true, status: res.status, data: data };
  } catch (err) {
    // fetch throws when the network is down / nothing is listening / the request timed out
    return { ok: false, status: 0, data: null, error: "اتصال به سرور برقرار نشد" };
  } finally { if (timer) clearTimeout(timer); }
}

var API = {
  live: false,      // set by detectLive()
  health: null,     // the /api/health payload (gateway kind etc.)
  base: API_BASE,
  get: function (p, o) { return apiFetch(p, o); },
  post: function (p, b) { return apiFetch(p, { method: "POST", body: JSON.stringify(b || {}) }); },
  put: function (p, b) { return apiFetch(p, { method: "PUT", body: JSON.stringify(b || {}) }); },
  patch: function (p, b) { return apiFetch(p, { method: "PATCH", body: JSON.stringify(b || {}) }); },
  del: function (p) { return apiFetch(p, { method: "DELETE" }); },

  // --- auth ---
  requestOtp: function (phone) { return API.post("/api/auth/otp", { phone: phone }); },
  verifyOtp: function (phone, code, name) {
    var payload = { phone: phone, code: code };
    if (name) payload.name = name;
    return API.post("/api/auth/verify", payload);
  },
  logout: function () { return API.post("/api/auth/logout"); },

  // --- catalog ---
  fetchProducts: function (params) {
    var qs = new URLSearchParams(params || {}).toString();
    return API.get("/api/products" + (qs ? "?" + qs : ""));
  },
  fetchProduct: function (slug) { return API.get("/api/products/" + encodeURIComponent(slug)); },
};

/* Is a SABZDARU backend reachable? (strict check: a static host that answers
   200 with an HTML fallback page must NOT count as "live") */
async function detectLive() {
  var r = await apiFetch("/api/health", { timeoutMs: 1500 });
  if (r.ok && r.data && r.data.ok === true && r.data.service === "sabzdaru") {
    API.live = true; API.health = r.data;
  }
  return API.live;
}

/* Persian (Jalali) calendar date, e.g. ۱۴۰۶/۰۸/۱۵ — the server sends ISO timestamps */
function jalali(iso) {
  try { return new Intl.DateTimeFormat("fa-IR", { year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso)); }
  catch (e) { return String(iso); }
}

/*
 * mergeApiProduct(local, api) — updates a product with the response of
 * GET /api/products/[slug] (fresh stock, price, reviews). Fields that only
 * make sense locally (icon, id) are left alone. Multi-variant products:
 * only the first variant is used for now, because the cart, filters and
 * listing UI all assume exactly one variant per product.
 */
function mergeApiProduct(local, api) {
  var v = (api.variants && api.variants[0]) || {};
  local.name = api.name;
  local.price = v.price != null ? v.price : local.price;
  local.sale = v.salePrice || null;
  local.stock = v.stock != null ? v.stock : local.stock;
  if (v.expiresAt) { local.expiresAt = v.expiresAt; local.expiry = jalali(v.expiresAt); }
  local.batch = v.batchCode || local.batch;
  local.desc = api.description || local.desc;
  local.usage = api.usage || local.usage;
  local.storage = api.storage || local.storage;
  local.warn = api.warnings || local.warn;
  local.ingredients = api.ingredients || local.ingredients;
  local.attrs = (api.attributes && Object.keys(api.attributes).length) ? api.attributes : local.attrs;
  local.rating = api.rating != null ? api.rating : (local.rating || 0);
  if (api.reviewCount != null) local.reviews = api.reviewCount;
  local.live = true;
  if (api.reviews) {
    S.reviews[local.id] = api.reviews.map(function (r) {
      return { id: r.id, by: r.author, stars: r.rating, text: r.body, helpful: r.helpful || 0, verified: !!r.verified, adminReply: r.adminReply || null };
    });
  }
  return local;
}

 }
 if(st===6){

<script>
/* views: login + account dashboard + admin panel */

/* ═══ ACCOUNT ═══ */

/* login state: real two-step OTP flow against the backend, with an explicit
   "demo mode" fallback for whenever no backend is actually deployed/reachable
   (which is the default state of this bundle right now). */
var login={step:1,phone:"",loading:false,err:"",isNewUser:false,code:""};

function viewLogin(){
 if(login.step===2)return viewLoginVerify();
 return'<div class="wrap section" style="max-width:440px"><div class="card card-pad">'+
 '<h1 class="t-h2" style="margin-bottom:6px">ورود یا ثبت‌نام</h1>'+

 '<div class="stack" style="gap:14px">'+
 '<div class="field"><label class="t-label" for="lphone">شمارهٔ موبایل</label>'+
 '<input class="input" id="lphone" type="tel" placeholder="۰۹xxxxxxxxx" value="'+esc(login.phone)+'" '+(login.err?'aria-invalid="true"':"")+'></div>'+
 (login.err?'<p class="hint hint-error">'+icon("i-alert")+esc(login.err)+'</p>':"")+
 '<button class="btn btn-primary btn-block" id="req-otp" '+(login.loading?"disabled":"")+'>'+
 (login.loading?'<span class="spin"></span> در حال ارسال':"دریافت کد ورود")+'</button>'+
 '<button class="btn btn-quiet btn-block btn-sm" id="demo-login">ورود در حالت نمایشی (بدون بک‌اند)</button>'+
 '</div></div></div>'}

function viewLoginVerify(){
 return'<div class="wrap section" style="max-width:440px"><div class="card card-pad">'+
 '<h1 class="t-h2" style="margin-bottom:6px">کد تأیید</h1>'+
 '<p class="t-small" style="margin-bottom:20px">کد ارسال‌شده به '+esc(login.phone)+' را وارد کنید.</p>'+
 '<div class="stack" style="gap:14px">'+
 '<div class="field"><label class="t-label" for="lcode">کد ۶ رقمی</label>'+
 '<input class="input" id="lcode" inputmode="numeric" maxlength="6" placeholder="------" value="'+esc(login.code||"")+'" '+(login.err?'aria-invalid="true"':"")+'></div>'+
 (login.isNewUser?'<div class="field"><label class="t-label" for="lname">نام شما (برای ساخت حساب تازه)</label><input class="input" id="lname" placeholder="نام و نام خانوادگی"></div>':"")+
 (login.err?'<p class="hint hint-error">'+icon("i-alert")+esc(login.err)+'</p>':"")+
 '<button class="btn btn-primary btn-block" id="verify-otp" '+(login.loading?"disabled":"")+'>'+
 (login.loading?'<span class="spin"></span> در حال بررسی':"تأیید و ورود")+'</button>'+
 '<button class="btn btn-ghost btn-block btn-sm" id="otp-back">اصلاح شماره</button>'+
 '</div></div></div>'}

/* the actual network calls — both fail soft via api.js and just set login.err */
async function requestOtpFlow(){
 var phone=(document.getElementById("lphone")||{}).value||"";
 var digits=phone.replace(/[۰-۹]/g,function(d){return FA.indexOf(d)});
 if(!/^0?9\d{9}$/.test(digits)){login.err="شمارهٔ موبایل معتبر نیست";render();return}
 login.phone=digits.startsWith("0")?digits:"0"+digits;
 login.loading=true;login.err="";render();
 var r=await API.requestOtp(login.phone);
 login.loading=false;
 if(!r.ok){login.err=r.error;render();return}
 login.step=2;login.err="";render();
}
async function verifyOtpFlow(){
 var code=(document.getElementById("lcode")||{}).value||"";
 var name=login.isNewUser?((document.getElementById("lname")||{}).value||""):undefined;
 if(!/^\d{6}$/.test(code)){login.err="کد باید ۶ رقم باشد";render();return}
 login.code=code;login.loading=true;login.err="";render();
 var r=await API.verifyOtp(login.phone,code,name);
 login.loading=false;
 if(!r.ok){
  // بک‌اند صراحتاً می‌گوید کاربر تازه است و نام لازم دارد
  if(r.status===400&&r.data&&r.data.newUser){login.isNewUser=true;login.err="برای ساخت حساب، نام را هم وارد کنید";render();return}
  login.err=r.error;render();return
 }
 S.user={id:r.data.user.id,name:r.data.user.name,mail:"",phone:r.data.user.phone};
 save();login={step:1,phone:"",loading:false,err:"",isNewUser:false};
 notify("خوش آمدید","وارد حساب شدید.");toast("خوش آمدید، "+S.user.name);render();
}

   return'<div class="card card-pad" style="margin-bottom:12px"><div class="between" style="flex-wrap:wrap;gap:8px">'+

   (o.status==="تحویل شده"?'<button class="btn btn-quiet btn-xs" data-oreturn="'+o.id+'">درخواست مرجوعی</button>':"")+
   (["پرداخت شده","در حال پردازش","آماده‌سازی"].indexOf(o.status)>-1?'<button class="btn btn-danger btn-xs" data-ocancel="'+o.id+'">لغو سفارش</button>':"")+
   '</div></div></div>'}).join("")

 if(t==="favs")return'<h1 class="t-h1" style="margin-bottom:20px">علاقه‌مندی‌ها</h1>'+
  (S.favs.length?'<div class="prod-grid">'+S.favs.map(prod).filter(Boolean).map(productCard).join("")+'</div>'
   :emptyState("i-heart","فهرست علاقه‌مندی خالی است","روی قلب هر کالا بزنید تا اینجا ذخیره شود.","دیدن محصولات",'data-go="home"'));

 var cd=document.getElementById("cartdot"),fd=document.getElementById("favdot"),md=document.getElementById("cmpdot");
 cd.textContent=fa(cartCount());cd.classList.toggle("hidden",!cartCount());
 fd.textContent=fa(S.favs.length);fd.classList.toggle("hidden",!S.favs.length);
 md.textContent=fa(S.compare.length);md.classList.toggle("hidden",!S.compare.length);
 document.getElementById("catnav").innerHTML=
  '<div class="mega'+(megaOpen?" open":"")+'" id="megacats"><button class="mega-trigger" id="megatrigger" aria-expanded="'+megaOpen+'">دسته‌بندی محصولات '+icon("i-down")+'</button>'+
  '<div class="mega-panel"><div class="mega-grid">'+CATS.map(function(c){
   return'<a data-go="cat" data-id="'+c.id+'"><i>'+icon(c.icon)+'</i><span><b>'+esc(c.name)+'</b><span>'+fa(S.products.filter(function(p){return p.cat===c.id}).length)+' کالا</span></span></a>'}).join("")+
  '</div></div></div>'+
  '<a data-go="blog" class="'+(R.view==="blog"?"on":"")+'">مجلهٔ سلامت</a>'+
  '<a data-go="brand" class="'+(R.view==="brand"?"on":"")+'">برندها</a>'+
  '<a data-go="compare" class="'+(R.view==="compare"?"on":"")+'">مقایسه</a>';
 document.getElementById("mobnav").innerHTML=[["home","i-home","خانه"],["cat","i-grid","دسته‌ها"],
  ["search","i-search","جست‌وجو"],["cart","i-cart","سبد"],["account","i-user","حساب"]].map(function(m){
  return'<button data-go="'+m[0]+'" aria-current="'+(R.view===m[0])+'">'+icon(m[1])+m[2]+
  (m[0]==="cart"&&cartCount()?'<span class="dot">'+fa(cartCount())+'</span>':"")+'</button>'}).join("");
 document.getElementById("foot").innerHTML='<div class="wrap"><div class="foot-grid"><div>'+
 '<a class="logo" data-go="home"><span class="mark">'+icon("i-leaf")+'</span>سبزدارو</a>'+
 '<p class="t-small measure" style="margin-top:16px">فروشگاه آنلاین محصولات بدون نسخهٔ داروخانه، مراقبت شخصی و تجهیزات سلامت خانگی. داروهای نسخه‌ای در این فروشگاه عرضه نمی‌شود.</p>'+
 '<p class="t-tiny" style="margin-top:12px">نسخهٔ نمایشی؛ همهٔ برندها، قیمت‌ها و نظرها ساختگی‌اند.</p></div>'+
 '<div><h4>خرید</h4><ul>'+CATS.slice(0,4).map(function(c){
  return'<li><a data-go="cat" data-id="'+c.id+'">'+esc(c.name)+'</a></li>'}).join("")+'</ul></div>'+
 '<div><h4>حساب من</h4><ul><li><a data-go="account" data-tab="orders">سفارش‌ها</a></li>'+
 '<li><a data-go="account" data-tab="favs">علاقه‌مندی‌ها</a></li>'+
 '<li><a data-go="account" data-tab="lists">فهرست‌های خرید</a></li>'+
 '<li><a data-go="account" data-tab="routines">روتین‌ها</a></li></ul></div>'+
 '<div><h4>پشتیبانی</h4><ul><li><a data-go="account" data-tab="tickets">تماس با ما</a></li>'+
 '<li><a data-go="blog">مجلهٔ سلامت</a></li><li><a data-go="admin">پنل مدیریت</a></li>'+
 '<li><a data-go="design">سیستم طراحی</a></li></ul></div></div>'+
 '<div class="foot-bottom"><span>© ۱۴۰۵ سبزدارو</span>'+
 '<span>اطلاعات محصولات جایگزین مشاورهٔ پزشکی نیست.</span></div></div>'}
function render(){
 var v=R.view,el=document.getElementById("app"),h="";
 try{
  h=v==="home"?viewHome():v==="cat"?viewCat():v==="product"?viewProduct():v==="cart"?viewCart():
    v==="checkout"?viewCheckout():v==="account"?viewAccount():v==="admin"?viewAdmin():
    v==="design"?viewDesign():v==="search"?viewSearch():v==="brand"?viewBrand():
    v==="blog"?viewBlog():v==="article"?viewArticle():v==="compare"?viewCompare():v==="order"?viewOrderResult():viewHome();
 }catch(e){
  h='<div class="wrap section">'+emptyState("i-alert","نمایش این صفحه ممکن نشد","خطایی رخ داد: "+e.message+" — به صفحهٔ اصلی بازگردید.","بازگشت به خانه",'data-go="home"')+'</div>';
 }
 el.innerHTML=h;renderChrome();
 var titles={home:"سبزدارو — داروخانه و سلامت",cart:"سبد خرید | سبزدارو",checkout:"تکمیل خرید | سبزدارو",
  account:"حساب کاربری | سبزدارو",admin:"پنل مدیریت | سبزدارو",design:"سیستم طراحی | سبزدارو",
  compare:"مقایسه | سبزدارو",blog:"مجلهٔ سلامت | سبزدارو"};
 document.title=titles[v]||"سبزدارو";
 // دادهٔ محلی همین الان روی صفحه نشان داده شده؛ این فقط یک تلاش پس‌زمینه برای
 // ارتقای بی‌صدا به دادهٔ زندهٔ API است — هر محصول فقط یک‌بار در این نشست امتحان می‌شود
 if(v==="product"&&R.params.id&&!triedLive[R.params.id]){triedLive[R.params.id]=true;loadProductLive(R.params.id)}
 // page-change animation: #app persists across renders, so retrigger its
 // CSS animation by toggling the class off → force reflow → on
 el.classList.remove("page-anim");void el.offsetWidth;el.classList.add("page-anim");
 if(v==="home")setupReveal();
}

/* scroll-reveal for the home page's top-level blocks. Safe no-op if
   IntersectionObserver isn't available (very old browsers) — content
   is visible by default per the CSS safety net either way. */
function setupReveal(){
 if(typeof IntersectionObserver==="undefined")return;
 if(!window.__revealObserver){
  window.__revealObserver=new IntersectionObserver(function(entries){
   entries.forEach(function(en){
    if(en.isIntersecting){en.target.classList.add("in-view");window.__revealObserver.unobserve(en.target)}
   });
  },{threshold:.12,rootMargin:"0px 0px -40px 0px"});
 }
 document.querySelectorAll(".home-main > *, .home-side > *").forEach(function(elm){
  if(elm.classList.contains("reveal"))return; // already set up, don't re-observe
  elm.classList.add("reveal");
  window.__revealObserver.observe(elm);
 });
}

</script>
<script>
/* ============================================================
   LIVE MODE — connects the whole frontend to the backend API.

   Design: the app was built (and still works) as a self-contained demo on
   localStorage. Live mode does NOT fork that code. It
     1. detects a backend (detectLive in api.js) and, only then,
     2. replaces the demo state with server state (catalog, account…),
     3. decorates a handful of view/logic functions (totals, viewAdmin…),
     4. intercepts UI actions in the CAPTURE phase and sends them to the API
        instead (events.js's demo handlers never see them).
   If no backend answers, none of this is installed and the demo runs as-is.

   Server is the source of truth for: catalog+stock, prices & totals (quote),
   orders, payments, accounts and everything in the admin panel.
   The browser keeps only: the cart, compare list, recently viewed, search
   history and (for guests) favourites.
   ============================================================ */

var STATIC_CATS = CATS.slice();            // UI config (icons, filter order) — merged with server categories
var QUOTE = { sig: "", data: null, inflight: null };
var ORDER_VIEW = { id: null, data: null, loading: false, err: null };
var AD = { loaded: {}, pending: {}, orders: [], products: [], moves: [], coupons: [], reviews: [], tickets: [], audit: [], customers: [] };
var live = { sfAt: 0, installed: false };

var ST_LABEL = { PENDING_PAYMENT: "در انتظار پرداخت", PAID: "پرداخت شده", PROCESSING: "در حال پردازش", PACKING: "آماده‌سازی", SHIPPED: "ارسال شده", DELIVERED: "تحویل شده", PAYMENT_FAILED: "پرداخت ناموفق", CANCELLED: "لغو شده", RETURN_REQUESTED: "درخواست مرجوعی", RETURNED: "مرجوع شده", DELIVERY_FAILED: "ارسال ناموفق", REFUNDED: "بازپرداخت شده" };
var ST_REV = {}; Object.keys(ST_LABEL).forEach(function (k) { ST_REV[ST_LABEL[k]] = k; });
var TICKET_REV = { "باز": "open", "در حال بررسی": "in_progress", "در انتظار مشتری": "waiting_customer", "حل شده": "resolved", "بسته شده": "closed" };
var PRIO_REV = { "عادی": "normal", "بالا": "high" };
var TAB_PERM = { products: "products.write", inventory: "inventory.write", orders: "orders.write", customers: "customers.read", promos: "promos.write", reviews: "reviews.moderate", tickets: "tickets.write", content: "content.write", analytics: "analytics.read", audit: "audit.read" };

function ascii(s) { return String(s == null ? "" : s).replace(/[۰-۹]/g, function (d) { return FA.indexOf(d); }); }

/* ───────────── state ───────────── */
function liveState() {
  var keep = { cart: [], favs: [], compare: [], recent: [], searchHistory: [] };
  try { var raw = JSON.parse(localStorage.getItem("sabzdaru.live.v1") || "null"); if (raw) Object.keys(keep).forEach(function (k) { if (Array.isArray(raw[k])) keep[k] = raw[k]; }); } catch (e) { }
  return { products: [], coupons: [], cart: keep.cart, favs: keep.favs, compare: keep.compare, lists: [], routines: [], recent: keep.recent, orders: [], tickets: [], notifs: [], reviews: {}, moves: [], audit: [], user: null, admin: null, searchHistory: keep.searchHistory, prefs: { promo: true, order: true, restock: true }, addresses: [] };
}
function liveSave() { try { localStorage.setItem("sabzdaru.live.v1", JSON.stringify({ cart: S.cart, compare: S.compare, recent: S.recent, searchHistory: S.searchHistory, favs: S.user ? [] : S.favs })); } catch (e) { } }

function applyStorefront(d) {
  var staticBy = {}; STATIC_CATS.forEach(function (c) { staticBy[c.id] = c; });
  d.categories.forEach(function (c) { (c.attributes || []).forEach(function (a) { FD[a.key] = { label: a.label, opts: a.options || [] }; }); });
  CATS = d.categories.map(function (c) {
    var st = staticBy[c.slug], keys = (c.attributes || []).map(function (a) { return a.key; });
    var filters = st ? st.filters.filter(function (f) { return f === "brand" || keys.indexOf(f) > -1; }) : [];
    keys.forEach(function (k) { if (filters.indexOf(k) < 0) filters.splice(Math.max(0, filters.indexOf("brand")), 0, k); });
    if (filters.indexOf("brand") < 0) filters.push("brand");
    return { id: c.slug, name: c.name, icon: st ? st.icon : "i-box", filters: filters };
  });
  BRANDS = d.brands.slice();
  SHIPPING = d.shipping.map(function (s) { return { id: s.id, name: s.name, days: s.days, fee: s.fee, freeAbove: s.freeAbove }; });
  ARTICLES = d.articles.slice();
  S.products = d.products.map(function (p) { p.icon = catOf(p.cat).icon; p.live = true; p.expiry = p.expiresAt ? jalali(p.expiresAt) : ""; return p; });
  if (!SHIPPING.some(function (s) { return s.id === checkout.ship; })) checkout.ship = SHIPPING[0] ? SHIPPING[0].id : "";
  live.sfAt = Date.now();
}
function pruneLocal() {
  S.cart = S.cart.filter(function (c) { return prod(c.id); });
  S.compare = S.compare.filter(function (i) { return prod(i); });
  S.recent = S.recent.filter(function (i) { return prod(i); });
  S.favs = S.favs.filter(function (i) { return prod(i); });
}
async function refreshStorefront(force) {
  if (!force && Date.now() - live.sfAt < 20000) return;
  live.sfAt = Date.now();
  var r = await API.get("/api/storefront"); if (!r.ok) return;
  applyStorefront(r.data); pruneLocal(); liveSave(); render();
}

/* account snapshot: every /api/me* mutation returns the full snapshot, so the UI just replaces its slices */
function applySnapshot(s) {
  S.user = { id: s.user.id, name: s.user.name, mail: s.user.email || "", phone: s.user.phone, role: s.user.role || null };
  S.admin = s.user.role ? s.user.role.key : null;
  S.prefs = s.prefs; S.addresses = s.addresses; S.lists = s.lists; S.routines = s.routines;
  S.favs = s.favs; S.notifs = s.notifs; S.orders = s.orders; S.tickets = s.tickets;
}
function clearAccount() {
  S.user = null; S.admin = null; S.addresses = []; S.lists = []; S.routines = []; S.favs = []; S.notifs = []; S.orders = []; S.tickets = [];
  S.prefs = { promo: true, order: true, restock: true };
  AD = { loaded: {}, pending: {}, orders: [], products: [], moves: [], coupons: [], reviews: [], tickets: [], audit: [], customers: [] };
  liveSave();
}
async function refreshAccount() {
  var r = await API.get("/api/me");
  if (r.ok) applySnapshot(r.data); else if (r.status === 401) clearAccount();
}
async function afterLogin() {
  var guest = S.favs.slice();                       // favourites made while logged out are kept
  await refreshAccount();
  if (!S.user) return;
  var missing = guest.filter(function (id) { return S.favs.indexOf(id) < 0 && prod(id); });
  for (var i = 0; i < missing.length; i++) { var r = await API.put("/api/me/favorites/" + missing[i]); if (r.ok) applySnapshot(r.data); }
}

/* ───────────── helpers for calling the API from the UI ───────────── */
async function call(promise, okMsg) {
  var r = await promise;
  if (!r.ok) {
    if (r.status === 401 && S.user) { clearAccount(); toast("نشست شما منقضی شده؛ دوباره وارد شوید", "error"); render(); return null; }
    toast(r.error || "خطا", "error"); return null;
  }
  if (okMsg) toast(okMsg);
  return r.data;
}
async function snap(promise, okMsg) { var d = await call(promise, okMsg); if (d) { applySnapshot(d); return d; } return null; }
function needLogin(msg) { toast(msg || "برای این کار وارد حساب شوید", "info"); go("account"); }

/* ───────────── cart pricing: the SERVER decides ───────────── */
function cartLines() { return S.cart.map(function (c) { var p = prod(c.id); return p && p.variantId ? { variantId: p.variantId, quantity: c.qty } : null; }).filter(Boolean); }
function quoteSig(code, ship) { return JSON.stringify([cartLines(), (code || "").toUpperCase(), ship]); }
async function ensureQuote(force) {
  if (!S.cart.length) { QUOTE = { sig: "", data: null, inflight: null }; return; }
  var sig = quoteSig(checkout.coupon, checkout.ship);
  if (!force && (QUOTE.sig === sig || QUOTE.inflight === sig)) return;
  QUOTE.inflight = sig;
  var r = await API.post("/api/checkout/quote", { lines: cartLines(), couponCode: checkout.coupon || undefined, shippingMethodId: checkout.ship });
  QUOTE.inflight = null;
  if (r.ok) { QUOTE = { sig: sig, data: r.data, inflight: null }; if (R.view === "cart" || R.view === "checkout") render(); }
}

/* ───────────── placing an order → paying ───────────── */
async function livePlaceFlow() {
  if (checkout.placing) return;
  var lines = cartLines(); if (!lines.length) { toast("سبد خرید خالی است", "error"); return; }
  checkout.placing = true;
  var btn = $("cbnext"); if (btn) { btn.innerHTML = '<span class="spin"></span> در حال انتقال به درگاه'; btn.disabled = true; }
  var a = checkout.address, c = checkout.customer;
  var body = {
    cartId: checkout.cartId || (checkout.cartId = uid("c")), lines: lines, couponCode: checkout.coupon || undefined, shippingMethodId: checkout.ship,
    address: { province: a.prov, city: a.city, line: a.line, postalCode: ascii(a.zip) },
    customer: { name: c.name, phone: ascii(c.phone), email: c.mail || "" }
  };
  var r = await API.post("/api/checkout/place", body);
  if (!r.ok) {
    checkout.placing = false; toast(r.error, "error");
    if (r.status === 409) await refreshStorefront(true);     // stock changed under us → show fresh numbers
    checkout.step = 4; render(); return;
  }
  if (S.user && a.line && !S.addresses.some(function (x) { return x.id && x.line === a.line; }))
    API.post("/api/me/addresses", { prov: a.prov, city: a.city, line: a.line, zip: ascii(a.zip) }).then(function (x) { if (x.ok) applySnapshot(x.data); });
  var sim = (checkout.method === "fail" && API.health && API.health.gateway === "sample") ? "fail" : undefined;
  var p = await API.post("/api/payments/initiate", { orderId: r.data.orderId, simulate: sim });
  checkout.placing = false; checkout.cartId = null;
  if (!p.ok) { toast(p.error, "error"); go("order", { id: r.data.orderId }); return; }
  location.href = p.data.redirectUrl;                         // → bank → /api/payments/callback → #/order/:id
}

/* ───────────── #/order/:id  (where the gateway sends the customer back) ───────────── */
var PAID_KEYS = ["PAID", "PROCESSING", "PACKING", "SHIPPED", "DELIVERED"];
async function loadOrderResult(id) {
  var r = await API.get("/api/orders/" + encodeURIComponent(id));
  if (ORDER_VIEW.id !== id) return;
  ORDER_VIEW.loading = false;
  if (!r.ok) ORDER_VIEW.err = r.error;
  else {
    ORDER_VIEW.data = r.data;
    if (PAID_KEYS.indexOf(r.data.statusKey) > -1) {         // only a CONFIRMED payment empties the cart
      S.cart = []; checkout.coupon = ""; checkout.step = 1; QUOTE = { sig: "", data: null, inflight: null }; liveSave(); renderChrome();
      if (S.user) refreshAccount();
      refreshStorefront(true);
    }
  }
  render();
}
function resultCard(kind, title, body, buttons) {
  var tone = kind === "ok" ? "border-style:solid;border-color:var(--green-soft);background:var(--surface)" : kind === "bad" ? "border-style:solid;border-color:rgba(166,58,46,.3);background:var(--error-bg)" : "border-style:solid;border-color:var(--line);background:var(--surface)";
  var ic = kind === "ok" ? "i-check" : kind === "bad" ? "i-alert" : "i-info", col = kind === "ok" ? "var(--green)" : kind === "bad" ? "var(--error)" : "var(--info)";
  return '<div class="wrap section" style="max-width:720px"><div class="state" style="' + tone + '"><i><span style="color:' + col + '">' + icon(ic) + '</span></i>' +
    '<b class="t-h2">' + esc(title) + '</b>' + body + '<div class="row" style="justify-content:center;margin-top:12px">' + buttons + '</div></div></div>';
}
function viewOrderResult() {
  var id = R.params.id || "";
  var back = '<button class="btn btn-quiet" data-go="home">بازگشت به فروشگاه</button>';
  if (id.indexOf("none") === 0) return resultCard("bad", "بازگشت از درگاه ناموفق بود", '<p>اطلاعات پرداخت دریافت نشد. اگر مبلغی کسر شده، با پشتیبانی تماس بگیرید.</p>', '<button class="btn btn-primary" data-go="cart">بازگشت به سبد خرید</button>' + back);
  if (!API.live) return '<div class="wrap section">' + emptyState("i-alert", "این بخش به سرور نیاز دارد", "سفارش‌های واقعی فقط در حالت اتصال به بک‌اند نمایش داده می‌شوند.", "بازگشت به خانه", 'data-go="home"') + '</div>';
  if (ORDER_VIEW.id !== id) { ORDER_VIEW = { id: id, data: null, loading: true, err: null }; loadOrderResult(id); }
  if (ORDER_VIEW.loading) return '<div class="wrap section" style="max-width:720px"><div class="card card-pad"><div class="skel" style="height:22px;width:40%;margin-bottom:14px"></div><div class="skel" style="height:14px;width:80%;margin-bottom:8px"></div><div class="skel" style="height:14px;width:60%"></div></div></div>';
  if (ORDER_VIEW.err) return resultCard("bad", "سفارش پیدا نشد", '<p>' + esc(ORDER_VIEW.err) + '</p>', back);
  var o = ORDER_VIEW.data, k = o.statusKey;
  if (PAID_KEYS.indexOf(k) > -1)
    return resultCard("ok", "سفارش شما ثبت شد", '<p>شمارهٔ سفارش: ' + esc(o.id) + ' · مبلغ پرداخت‌شده: ' + toman(o.total) + '</p>' + (o.txn ? '<p class="t-tiny">کد پیگیری تراکنش: ' + esc(o.txn.ref) + '</p>' : ""),
      '<button class="btn btn-primary" data-go="account" data-tab="orders">پیگیری سفارش</button>' + back);
  if (k === "PENDING_PAYMENT")
    return resultCard("info", "پرداخت هنوز انجام نشده", '<p>سفارش ' + esc(o.id) + ' ثبت شده و منتظر پرداخت شماست. تا تکمیل پرداخت، کالاها برایتان نگه داشته می‌شوند.</p>',
      '<button class="btn btn-primary" id="pay-continue" data-oid="' + esc(o.oid) + '">ادامه پرداخت</button><button class="btn btn-quiet" data-go="cart">بازگشت به سبد خرید</button>');
  return resultCard("bad", "پرداخت ناموفق بود", '<p>مبلغی از حساب شما کسر نشده است. سفارش ' + esc(o.id) + ' بسته شد و <b>سبد خرید شما حفظ شده</b>؛ می‌توانید دوباره تلاش کنید.</p>',
    '<button class="btn btn-primary" data-go="cart">بازگشت به سبد خرید</button>' + back);
}

/* ───────────── admin panel data ───────────── */
var NEEDS = { dash: ["orders", "products"], products: ["products"], inventory: ["products", "moves"], orders: ["orders"], customers: ["customers"], promos: ["coupons"], reviews: ["reviews"], tickets: ["tickets"], content: [], analytics: ["orders", "products"], audit: ["audit"] };
var DATA_PERM = { orders: "orders", products: "products|inventory", moves: "inventory", coupons: "promos", reviews: "reviews", tickets: "tickets", customers: "customers", audit: "audit" };
var DATA_URL = { orders: "/api/admin/orders", products: "/api/admin/products", moves: "/api/admin/inventory", coupons: "/api/admin/promos", reviews: "/api/admin/reviews", tickets: "/api/admin/tickets", customers: "/api/admin/customers", audit: "/api/admin/audit" };
function permitted(k) { return DATA_PERM[k].split("|").some(function (t) { return can(t); }); }
function adminReady(tab) { return (NEEDS[tab] || []).every(function (k) { return !permitted(k) || AD.loaded[k]; }); }
async function loadAdmin(keys, force) {
  var todo = keys.filter(function (k) { return permitted(k) && (force || !AD.loaded[k]) && !AD.pending[k]; });
  if (!todo.length) return;
  todo.forEach(function (k) { AD.pending[k] = true; });
  await Promise.all(todo.map(async function (k) {
    var r = await API.get(DATA_URL[k]); AD.pending[k] = false; AD.loaded[k] = true;
    if (r.ok) { AD[k] = k === "moves" ? r.data.moves : k === "audit" ? r.data.logs : r.data; if (k === "products") AD.products.forEach(function (p) { p.icon = catOf(p.cat).icon; }); }
    else { AD[k] = []; toast(r.error, "error"); }
  }));
  render();
}

/* ───────────── installing live mode (only when a backend answered) ───────────── */
function installLive() {
  if (live.installed) return; live.installed = true;
  save = liveSave;
  notify = function () { };                                   // notifications come from the server
  var _prod = prod;
  prod = function (id) { var p = _prod(id); if (p || !API.live) return p; for (var i = 0; i < AD.products.length; i++) if (AD.products[i].id === id) return AD.products[i]; return null; };
  can = function (t) { if (!S.user || !S.user.role) return false; var pm = S.user.role.permissions || []; return t === "dash" || pm.indexOf("*") > -1 || pm.indexOf(TAB_PERM[t]) > -1; };

  var _totals = totals;
  totals = function (code, shipId) {
    var sub = 0, sv = 0;
    S.cart.forEach(function (c) { var p = prod(c.id); if (!p) return; sub += eff(p) * c.qty; if (p.sale) sv += (p.price - p.sale) * c.qty; });
    var q = QUOTE.data && QUOTE.sig === quoteSig(code, shipId) ? QUOTE.data : null;
    if (q) return { sub: q.subtotal, save: q.savings, disc: q.discount, shipFee: q.shippingFee, cErr: q.couponError, total: q.total };
    var m = SHIPPING.filter(function (s) { return s.id === shipId; })[0], fee = m ? m.fee : 0;       // provisional estimate until the server answers
    if (m && m.freeAbove != null && sub >= m.freeAbove) fee = 0;
    return { sub: sub, save: sv, disc: 0, shipFee: fee, cErr: null, total: sub + fee };
  };
  var _summary = summaryCard;
  summaryCard = function (t, w) { return _summary(t, w).replace(/<span class="hint">کدهای فعال نمونه[^<]*<\/span>/, ""); };

  var _viewLogin = viewLogin;
  viewLogin = function () {
    var h = _viewLogin().replace(/<button class="btn btn-quiet btn-block btn-sm" id="demo-login">[^<]*<\/button>/, "");
    return R.view === "admin" ? h.replace("ورود یا ثبت‌نام", "ورود به پنل مدیریت") : h;
  };
  var _verify = verifyOtpFlow;
  verifyOtpFlow = async function () {
    var code = (document.getElementById("lcode") || {}).value || "";
    var name = login.isNewUser ? ((document.getElementById("lname") || {}).value || "") : undefined;
    if (!/^\d{6}$/.test(code)) { login.err = "کد باید ۶ رقم باشد"; render(); return; }
    login.code = code; login.loading = true; login.err = ""; render();
    var r = await API.verifyOtp(login.phone, code, name);
    login.loading = false;
    if (!r.ok) {
      if (r.status === 400 && r.data && r.data.newUser) { login.isNewUser = true; login.err = "برای ساخت حساب، نام را هم وارد کنید"; render(); return; }
      login.err = r.error; render(); return;
    }
    login = { step: 1, phone: "", loading: false, err: "", isNewUser: false, code: "" };
    await afterLogin(); toast("خوش آمدید، " + (S.user ? S.user.name : "")); render();
  };

  var _admBody = admBody;
  admBody = function () {
    var t = adm.tab; loadAdmin(NEEDS[t] || []);
    if (!adminReady(t)) return skeletonAdmin();
    if (t === "customers") return liveCustomers();
    if (t === "reviews") return liveReviews();
    return _admBody();
  };
  var _viewAdmin = viewAdmin;
  viewAdmin = function () {
    if (!S.user) return viewLogin();
    if (!S.user.role) return noAccessCard();
    var real = S;                                              // render the admin UI against admin data, without ever mutating real state
    S = Object.assign({}, real, { orders: AD.orders, products: AD.products, coupons: AD.coupons, tickets: AD.tickets, audit: AD.audit, moves: AD.moves });
    try { return _viewAdmin(); } finally { S = real; }
  };

  var _render = render;
  render = function () {
    if (R.view === "checkout" && S.user && !(checkout.customer && checkout.customer.name)) checkout.customer = { name: S.user.name, phone: S.user.phone, mail: S.user.mail };
    _render();
    if (R.view === "cart" || R.view === "checkout") { ensureQuote(); refreshStorefront(); }
  };
}

qEl.addEventListener("input",function(){
 var v=qEl.value.trim();
 if(!v){sEl.innerHTML="";return}
 var r=searchAll(v);
 var hist=S.searchHistory.filter(function(h){return h.indexOf(v)>-1}).slice(0,2);
 var h='<div class="sugg">';
 if(!r.products.length&&!r.brands.length&&!r.cats.length&&!r.articles.length)
  h+='<div style="padding:18px;text-align:center" class="t-small">نتیجه‌ای پیدا نشد. املا را بررسی کنید.</div>';
 if(hist.length)h+='<h5>جست‌وجوهای اخیر</h5>'+hist.map(function(x){
  return'<a data-sq="'+esc(x)+'">'+icon("i-log")+esc(x)+'</a>'}).join("");
 if(r.cats.length)h+='<h5>دسته‌بندی</h5>'+r.cats.slice(0,3).map(function(c){
  return'<a data-go="cat" data-id="'+c.id+'">'+icon(c.icon)+esc(c.name)+'</a>'}).join("");
 if(r.brands.length)h+='<h5>برند</h5>'+r.brands.slice(0,3).map(function(b){
  return'<a data-go="brand" data-id="'+b.id+'">'+icon("i-tag")+esc(b.name)+'</a>'}).join("");
 if(r.products.length)h+='<h5>کالا</h5>'+r.products.slice(0,5).map(function(p){
  return'<a data-open="'+p.id+'">'+icon(p.icon)+esc(p.name)+'<small>'+money(eff(p))+'</small></a>'}).join("");
 if(r.articles.length)h+='<h5>مقاله</h5>'+r.articles.slice(0,2).map(function(a){
  return'<a data-article="'+a.id+'">'+icon("i-file")+esc(a.title)+'</a>'}).join("");
 sEl.innerHTML=h+'</div>'});
function runSearch(v){
 if(!v)return;
 if(S.searchHistory.indexOf(v)<0){S.searchHistory.unshift(v);S.searchHistory=S.searchHistory.slice(0,8);save()}
 sEl.innerHTML="";R.params.q=v;location.hash="#/search/"+encodeURIComponent(v)}
qEl.addEventListener("keydown",function(e){if(e.key==="Enter")runSearch(qEl.value.trim())});

 if(!e.target.closest(".searchbox"))sEl.innerHTML="";

/* scroll-driven polish: header gains a shadow once the page scrolls under
   it, and a back-to-top button appears after scrolling a page or so down.
   rAF-throttled so this never runs more than once per frame. */
document.documentElement.classList.add("js-ready");
var headerEl=document.querySelector("header.site");
var toTopBtn=$("toTop");
var scrollTicking=false;
function onScrollPolish(){
 if(scrollTicking)return;scrollTicking=true;
 requestAnimationFrame(function(){
  var y=window.scrollY||document.documentElement.scrollTop||0;
  if(headerEl)headerEl.classList.toggle("scrolled",y>8);
  if(toTopBtn)toTopBtn.classList.toggle("show",y>480);
  scrollTicking=false;
 });
}
window.addEventListener("scroll",onScrollPolish,{passive:true});
if(toTopBtn)toTopBtn.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};

/* swipe the hero banner on touch screens (left = next, right = previous in RTL) */
var heroTouchX=null;
document.addEventListener("touchstart",function(e){
 var h=e.target.closest&&e.target.closest(".hero-panel");
 heroTouchX=h&&!e.target.closest("button")?e.touches[0].clientX:null;
},{passive:true});
document.addEventListener("touchend",function(e){
 if(heroTouchX==null)return;
 var dx=e.changedTouches[0].clientX-heroTouchX;heroTouchX=null;
 if(Math.abs(dx)>50){heroSlide=(heroSlide+HERO_SLIDES.length+(dx<0?1:-1))%HERO_SLIDES.length;render()}
},{passive:true});

bootApp();   /* live.js: detects a backend, then renders (live or demo mode) */
